listener 1883
# rede de laboratorio. Na VLAN de IoT a ideia e usar usuario/senha (password_file)
allow_anonymous true

# guarda em disco as sessoes persistentes e mensagens retidas,
# assim um restart do broker nao perde o que estava na fila do backend
persistence true
persistence_location /mosquitto/data/

# quantas mensagens QoS 1 ficam na fila de um cliente desconectado
max_queued_messages 5000
