services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: broker-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-dados:/mosquitto/data
    restart: unless-stopped

volumes:
  mosquitto-dados:
